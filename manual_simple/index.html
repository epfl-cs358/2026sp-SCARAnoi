<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ESP32 Arduino Serial Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    h1 {
      color: #ff7a00;
    }

    button {
      padding: 12px 18px;
      margin-right: 8px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      background: #ff7a00;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      width: 260px;
    }

    pre {
      margin-top: 16px;
      padding: 16px;
      min-height: 260px;
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #b9ffcb;
    }
  </style>
</head>

<body>
  <h1>ESP32 ↔ Arduino Serial Test</h1>

  <p>Click a button to send a command and display everything Arduino sends back.</p>

  <button onclick="sendCommand('M114')">Send M114</button>
  <button onclick="sendCommand('G92 X0 Y0 Z0 E0')">Send G92</button>

  <br />

  <input id="customCommand" type="text" value="M114" />
  <button onclick="sendCustom()">Send Custom</button>

  <pre id="output">Waiting...</pre>

  <script>
    const ESP_IP = "192.168.4.1";

    async function sendCommand(command) {
      const output = document.getElementById("output");

      output.textContent = "Sending: " + command + "\nWaiting for Arduino response...";

      try {
        const response = await fetch(
          `http://${ESP_IP}/send?msg=${encodeURIComponent(command)}`
        );

        const text = await response.text();

        output.textContent =
          "Command sent:\n" +
          command +
          "\n\nRaw Arduino response:\n" +
          text;
      } catch (error) {
        output.textContent = "Request failed:\n" + error;
      }
    }

    function sendCustom() {
      const command = document.getElementById("customCommand").value.trim();

      if (command.length === 0) {
        document.getElementById("output").textContent = "Command is empty.";
        return;
      }

      sendCommand(command);
    }
  </script>
</body>
</html>
